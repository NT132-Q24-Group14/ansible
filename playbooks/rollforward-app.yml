- name: Rollforward Application
  hosts: app
  become: true

  vars:
    image_repo: mothmon14682/pms
    container_name_old: pms_rollback
    container_name_new: pms
    container_port: 8080
    nginx_config_path: /etc/nginx/sites-available/pms

  tasks:
    - name: Validate image_tag is provided
      ansible.builtin.fail:
        msg: "Biến image_tag chưa được truyền vào."
      when: image_tag is not defined or image_tag == ""

    - name: Pull image version roll-forward
      community.docker.docker_image:
        name: "{{ image_repo }}:{{ image_tag }}"
        source: pull
        force_source: true

    - name: Chạy container roll-forward
      community.docker.docker_container:
        name: "{{ container_name_new }}"
        image: "{{ image_repo }}:{{ image_tag }}"
        state: started
        restart_policy: always
        ports:
          - "8080:{{ container_port }}"
        env:
          pms_db_host: "{{ db_host }}"
          pms_db_name: "{{ db_name }}"
          pms_db_username: "{{ db_username }}"
          pms_db_password: "{{ db_password }}"

    - name: Chờ container roll-forward sẵn sàng
      ansible.builtin.wait_for:
        host: localhost
        port: 8080
        timeout: 30

    - name: Đổi upstream Nginx sang container roll-forward
      ansible.builtin.replace:
        path: "{{ nginx_config_path }}"
        regexp: 'server localhost:\d+;'
        replace: 'server localhost:8080;'

    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Xóa container cũ
      community.docker.docker_container:
        name: "{{ container_name_old }}"
        state: absent