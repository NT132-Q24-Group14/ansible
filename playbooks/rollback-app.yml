- name: Rollback Application
  hosts: app
  become: true

  vars:
    image_repo: mothmon14682/pms
    container_name_old: pms
    container_name_new: pms_rollback
    container_port: 8080
    nginx_config_path: /etc/nginx/sites-available/pms

  tasks:
    - name: Validate image_tag is provided
      ansible.builtin.fail:
        msg: "The image_tag variable is required."
      when: image_tag is not defined or image_tag == ""

    - name: Pull rollback image
      community.docker.docker_image:
        name: "{{ image_repo }}:{{ image_tag }}"
        source: pull
        force_source: true

    - name: Start rollback container
      community.docker.docker_container:
        name: "{{ container_name_new }}"
        image: "{{ image_repo }}:{{ image_tag }}"
        state: started
        restart_policy: always
        ports:
          - "8081:{{ container_port }}"
        env:
          pms_db_host: "{{ db_host }}"
          pms_db_name: "{{ db_name }}"
          pms_db_username: "{{ db_username }}"
          pms_db_password: "{{ db_password }}"

    - name: Wait for rollback container
      ansible.builtin.wait_for:
        host: localhost
        port: 8081
        timeout: 30

    - name: Switch Nginx upstream to rollback container
      ansible.builtin.replace:
        path: "{{ nginx_config_path }}"
        regexp: 'server localhost:\d+;'
        replace: 'server localhost:8081;'

    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Remove old container
      community.docker.docker_container:
        name: "{{ container_name_old }}"
        state: absent
